services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: roamly
      POSTGRES_PASSWORD: roamly
      POSTGRES_DB: roamly
    ports:
      - "5432:5432"
    volumes:
      - roamly_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roamly"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  roamly_data:

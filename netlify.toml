[build]
  base = "."
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

[functions]
  directory = "netlify/functions"

# Explicitly package SSR pages, API routes and public assets for this deployment.
[[plugins]]
  package = "@netlify/plugin-nextjs"
